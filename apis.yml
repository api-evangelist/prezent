aid: prezent
name: Prezent
description: >-
  Prezent is an AI-powered business communications and presentation platform, with Prezent Vivo
  purpose-built for life sciences teams. Its Prezent Platform API exposes the AutoGenerator (turn a
  prompt plus source files into an on-brand deck), Template Converter (reformat existing decks to a
  brand-compliant template), Audiences, Themes, and file-upload services as a uniform, agent-ready
  JSON HTTP API. The API uses a Bearer API key, a uniform success/error envelope with a stable error
  code catalog, Idempotency-Key support, cursor pagination, rate-limit headers, first-class webhooks,
  and ships an official Model Context Protocol (MCP) server plus typed Python and TypeScript SDKs.
  Backed by 500 Global.
