  # -------------------------------------------------------------------------
  # Webhooks (subscription management plane).
  #
  # All paths are scoped to the calling API key. Subscriptions are
  # per-key — a key can only manage subscriptions it created. The HMAC
  # secret is returned ONCE on create / rotate; reads only expose the
  # `secret_prefix` (first 6 chars).
  # -------------------------------------------------------------------------
  /api/v1/webhook-subscriptions:
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      description: |
        Registers a new HTTPS endpoint to receive signed delivery
        callbacks for the listed event types. Returns the HMAC `secret`
        ONCE — store it securely. Subsequent reads only expose the
        `secret_prefix`.
      operationId: createWebhookSubscription
      x-rate-limit-category: general
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreateRequest'
      responses:
        '201':
          description: Subscription created. Body contains the
            `secret` — the only response that ever exposes it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionCreateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      description: |
        Returns the subscriptions owned by the calling API key. Excludes
        soft-deleted rows. Use the standard cursor-pagination parameters
        — see [Developer Guide → Pagination](/docs/developer-guide#pagination).
      operationId: listWebhookSubscriptions
      x-rate-limit-category: general
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Paginated subscription list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/webhook-subscriptions/{id}:
    get:
      tags: [Webhooks]
      summary: Read a webhook subscription
      description: |
        Returns one subscription. `secret_prefix` (the first 6 chars of
        the HMAC secret) is exposed for human disambiguation; the full
        secret is never returned by a read.
      operationId: getWebhookSubscription
      x-rate-limit-category: general
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionIdPath'
      responses:
        '200':
          description: Subscription found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionReadResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
    patch:
      tags: [Webhooks]
      summary: Update a webhook subscription
      description: |
        Partial update. Any combination of `url`, `events`, `description`,
        or `status` may be supplied. Changes to `url` are re-validated
        against the SSRF / scheme / port rules. Setting `status` to
        `"active"` re-enables an auto-disabled subscription.
      operationId: updateWebhookSubscription
      x-rate-limit-category: general
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdateRequest'
      responses:
        '200':
          description: Subscription updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionReadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      description: |
        Soft-deletes the subscription. The `id` is permanently retired
        — no future deliveries will be attempted, and the row is
        excluded from list responses.
      operationId: deleteWebhookSubscription
      x-rate-limit-category: general
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionIdPath'
      responses:
        '200':
          description: Subscription deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionDeleteResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/webhook-subscriptions/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Rotate the HMAC secret for a subscription
      description: |
        Generates a new HMAC `secret` and invalidates the old one
        immediately. Returns the new secret ONCE — store it before
        responding to the caller. There is no grace window during which
        both secrets verify; if you need an overlap, stand up a second
        subscription on a distinct path, switch over, then delete the
        old one.
      operationId: rotateWebhookSubscriptionSecret
      x-rate-limit-category: general
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionIdPath'
      responses:
        '200':
          description: Secret rotated. Body contains the new
            `secret` — the only place it is ever returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionRotateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/webhook-subscriptions/{id}/test:
    post:
      tags: [Webhooks]
      summary: Send a test delivery to a subscription
      description: |
        Immediately POSTs a synthetic `webhook.test` event to the
        subscription's URL (signed with the current secret, 5s timeout,
        no retries) and returns the response status + body verbatim.
        Use this to verify the receiver's signature-verification path
        before real traffic flows.
      operationId: testWebhookSubscription
      x-rate-limit-category: general
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionIdPath'
      responses:
        '200':
          description: Test delivery attempted. The `delivery.ok` field
            indicates whether the receiver returned a 2xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionTestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  # =========================================================================
  # Streaming (Server-Sent Events)
  # =========================================================================
  /api/v1/streams/sessions:
    post:
      tags: [Streaming]
      summary: Open a stream session for an existing job
      description: |
        Returns a short-lived URL (5-minute TTL) that you open with
        EventSource (or any SSE client) to receive a live feed of
        progress events for the job identified by `callback_id`. The
        token in the URL is bound to your API key and to that
        `callback_id` only.

        See the [Streaming guide](/docs/streaming) for the full
        walk-through, the event catalog, and reconnect semantics.
      operationId: createStreamSession
      x-rate-limit-category: general
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamSessionCreateRequest'
      responses:
        '201':
          description: A streaming URL has been minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSessionCreateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

# =========================================================================
# Webhooks — events Prezent POSTs to your subscribed HTTPS endpoint.
# Manage subscriptions via the /api/v1/webhook-subscriptions endpoints above.
# Every delivery is signed (X-Prezent-Signature: HMAC-SHA256 of
# "{timestamp}.{raw_body}"); delivery is at-least-once with retries at
# +1m, +5m, +30m, +2h, +6h, +18h over a 21-hour window, then a dead-letter
# queue. A subscription auto-disables after 50 consecutive failures.
# =========================================================================
webhooks:
  autogeneration.completed:
    post:
      tags: [Webhooks]
      summary: AutoGenerator job completed
      description: |
        Delivered when an AutoGenerator job finishes successfully. Verify
        the `X-Prezent-Signature` header and deduplicate on the event `id`.
      operationId: webhookAutogenerationCompleted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200':
          description: Acknowledged — return any 2xx within 10 seconds to mark the delivery successful.
  autogeneration.failed:
    post:
      tags: [Webhooks]
      summary: AutoGenerator job failed
      description: Delivered when an AutoGenerator job fails. Same envelope, signature, and retry semantics as `autogeneration.completed`.
      operationId: webhookAutogenerationFailed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Acknowledged — any 2xx within 10 seconds. }
  template_conversion.completed:
    post:
      tags: [Webhooks]
      summary: Template Converter job completed
      description: Delivered when a Template Converter job finishes successfully.
      operationId: webhookTemplateConversionCompleted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Acknowledged — any 2xx within 10 seconds. }
  template_conversion.failed:
    post:
      tags: [Webhooks]
      summary: Template Converter job failed
      description: Delivered when a Template Converter job fails.
      operationId: webhookTemplateConversionFailed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Acknowledged — any 2xx within 10 seconds. }
  webhook.test:
    post:
      tags: [Webhooks]
      summary: Test delivery
      description: |
        Sent once when you call the subscription `test` endpoint. Single-shot
        — delivered once with no retries — so you can verify connectivity and
        signature handling before production traffic flows.
      operationId: webhookTest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '200': { description: Acknowledged — any 2xx within 10 seconds. }

# =========================================================================
# Components
# =========================================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer token authentication. Supply the API key issued by
        Customer Success as `Authorization: Bearer <api_key>`. The API
        does NOT accept the AWS `x-api-key` header. Keys may have an
        expiry date; expired keys return `401 EXPIRED_API_KEY`. Keys are
        scoped to specific paths; calling an unauthorised path returns
        `404 ENDPOINT_NOT_FOUND`.

  parameters:
    CallbackIdPath:
      name: callback_id
      in: path
      required: true
      description: Server-issued opaque identifier returned by an async
        kick-off endpoint. Used to poll status or fetch derived
        artefacts.
      schema:
        type: string
        minLength: 1

    WebhookSubscriptionIdPath:
      name: id
      in: path
      required: true
      description: The public subscription id returned by `POST
        /api/v1/webhook-subscriptions` — shaped `whsub_<32 hex chars>`.
      schema:
        type: string
        pattern: '^whsub_[a-f0-9]{32}$'
        example: whsub_3f7a9b1c8d2e4f5a6b7c8d9e0f1a2b3c

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional client-generated key (a UUID is ideal) that makes a
        write request safe to retry. The first request is processed and
        its response cached for 24 hours; an identical retry with the
        same key returns the cached response plus an
        `Idempotency-Replayed: true` header, so the job is never created
        twice. Reusing a key with a **different** body returns
        `409 IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY`.
      schema:
        type: string
        example: 8e6df756-18f6-4f16-8e12-7d7a5c5cb181

  headers:
    IdempotencyReplayed:
      description: Present and set to `true` when this response was served
        from the idempotency cache for a repeated `Idempotency-Key`.
      schema: { type: string, enum: ['true'] }
    XRateLimitLimit:
      description: |
        The configured request limit for the rate-limit category
        (requests per 60-second window) that applied to this call.
        The applicable category is the operation's `x-rate-limit-category`.
        Returned on every response (success and 429) so clients can
        self-throttle. See the Rate limits guide for the default
        per-category numbers.
      schema: { type: integer, format: int32, minimum: 0 }
    XRateLimitRemaining:
      description: |
        Approximate number of requests remaining in the current
        60-second window for this caller and category.
      schema: { type: integer, format: int32, minimum: 0 }
    XRateLimitReset:
      description: Unix timestamp (seconds) when the current rate-limit
        window resets.
      schema: { type: integer, format: int64, minimum: 0 }
    RetryAfter:
      description: Number of seconds the client should wait before
        retrying.
      schema: { type: integer, format: int32, minimum: 0 }

  schemas:

    # ---- Envelopes -------------------------------------------------------
    SuccessEnvelope:
      type: object
      description: |
        Standard success envelope. Endpoint-specific schemas extend this
        and constrain the `data` property to their concrete shape.
        Additional legacy keys (`status`, `log`, …) may appear alongside
        `success`/`data` for backwards compatibility, and some legacy
        handlers omit `success`, so it is not marked required.
      required: [data]
      properties:
        success:
          type: boolean
          description: '`true` on success (omitted by some legacy handlers).'
        data:
          type: object
          description: Endpoint-specific payload.
      additionalProperties: true

    ErrorEnvelope:
      type: object
      description: |
        Standard error envelope returned by every documented endpoint
        (both in-Lambda and gateway-level errors). Additional legacy
        keys may appear alongside `success`/`data`/`error` for
        backwards compatibility.
      required: [success, data, error]
      properties:
        success:
          type: boolean
          const: false
          description: Always `false` on error.
        data:
          type: ['object', 'null']
          description: Always `null` on error.
        error:
          type: object
          required: [code, message]
          description: Error description.
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable error description (English).
            details:
              type: object
              description: Optional structured details (validation
                failures, downstream-service info, etc.).
              additionalProperties: true
      additionalProperties: true

    ErrorCode:
      type: string
      description: |
        Stable identifier for an error condition. Codes never change
        meaning or HTTP status once published.
      enum:
        - INVALID_API_KEY
        - EXPIRED_API_KEY
        - UNAUTHORIZED
        - FORBIDDEN
        - ENDPOINT_NOT_FOUND
        - RESOURCE_NOT_FOUND
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - UNSUPPORTED_FILE_TYPE
        - INVALID_INPUT
        - UNPROCESSABLE_ENTITY
        - RATE_LIMIT_EXCEEDED
        - USAGE_LIMIT_EXCEEDED
        - TOO_MANY_REQUESTS
        - THROTTLED
        - BAD_REQUEST
        - INVALID_JSON
        - MISSING_REQUIRED_FIELD
        - MISSING_QUERY_PARAM
        - MISSING_CALLBACK_ID
        - MISSING_SLIDES_ARRAY
        - MISSING_PROMPT
        - MISSING_TEMPLATE_ID
        - MISSING_FILE_CONTENT
        - MISSING_SHARE_DETAILS
        - INVALID_TYPE
        - INVALID_DATA
        - INVALID_DATA_TYPE
        - INVALID_PAYLOAD
        - INVALID_REQUEST
        - API_REQUEST_FAILED
        - FILE_UPLOAD_FAILED
        - MAX_RETRIES_EXCEEDED
        - EXTERNAL_SERVICE_ERROR
        - INTERNAL_SERVER_ERROR
        - SERVICE_UNAVAILABLE
        - GATEWAY_TIMEOUT

    CallbackEnvelope:
      description: Async-start envelope. `data.callback_id` is the value
        the client polls.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [callback_id]
              properties:
                callback_id:
                  type: string
                  description: Server-issued opaque identifier.
                token:
                  type: string
                  description: Optional one-time token used by
                    callback-id-scoped URLs (for example status polling
                    when no Bearer key is available).
              additionalProperties: true

    RateLimitInfo:
      type: object
      description: Out-of-body rate-limit information. Returned via
        headers, not in the response body; this schema exists for tooling
        only.
      properties:
        limit:
          type: integer
          description: Configured requests-per-window for the category.
        remaining:
          type: integer
          description: Approximate requests remaining in the current
            window.
        reset:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the window resets.
        retry_after_seconds:
          type: integer
          description: Seconds to wait before retrying.

    # ---- Test / Health ---------------------------------------------------
    TestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                message:
                  type: string
                  description: Fixed greeting string.
              additionalProperties: true

    HealthResponse:
      description: Liveness / health response. The simple liveness probe
        returns just a `message`; component health checks may return a
        richer `data` payload (per-service status, timestamp).
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          description: Liveness message.
        status:
          type: string
          description: Overall status, when reported.
        data:
          type: object
          additionalProperties: true
          description: Optional richer health payload.
          properties:
            message:
              type: string
            category:
              type: string
              description: The category that was checked.
            services:
              type: array
              description: Per-component status report.
              items:
                type: object
                additionalProperties: true
                properties:
                  name:
                    type: string
                  status:
                    type: string
                  detail:
                    type: string
            timestamp:
              type: string
              format: date-time

    # ---- AutoGenerator: requests ----------------------------------------
    AutoGeneratorStartRequest:
      type: object
      description: Request body for `POST /api/v1/autogenerator`.
      required: [prompt]
      properties:
        prompt:
          type: string
          description: Natural-language description of the deck to
            generate.
        text:
          type: string
          description: Additional free-text context to ground the deck.
        files:
          type: array
          description: Previously uploaded supporting files (by id).
          items: { type: string }
        web_links:
          type: array
          description: Web URLs to ingest as additional context.
          items: { type: string, format: uri }
        image_ids:
          type: array
          description: Image identifiers to source from the caller's
            library.
          items: { type: string }
        audience:
          type: string
          description: Target audience id or persona name.
        template_id:
          type: string
          description: Target theme/template id.
        settings:
          type: object
          description: Per-generation settings.
          properties:
            add_sources_to_footer:
              type: boolean
              description: Render source attributions in slide footers.
            add_sources_to_slides_note:
              type: boolean
              description: Render source attributions in slide notes.
            generate_speaker_notes:
              type: boolean
              description: Generate speaker notes.
            extract_graph_data:
              type: boolean
              description: Extract structured data from images/charts in
                supporting files.
          additionalProperties: true
      additionalProperties: true

    AutoGeneratorStatusBulkRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/status-bulk`.
      required: [callback_ids]
      properties:
        callback_ids:
          type: array
          description: Callback ids to look up.
          minItems: 1
          items: { type: string }
      additionalProperties: true

    AutoGeneratorMetaRequest:
      type: object
      description: Request body for `POST /api/v1/autogenerator/meta`.
      required: [assetIds, callbackID]
      properties:
        assetIds:
          type: array
          description: Asset ids to look up metadata for.
          minItems: 1
          items: { type: string }
        callbackID:
          type: string
          description: Parent deck callback id. (Legacy camelCase
            preserved for backwards compatibility; new clients should
            also continue to send this field.)
      additionalProperties: true

    AutoGeneratorDownloadRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/download`.
      required: [callback_id]
      properties:
        callback_id:
          type: string
          minLength: 1
          description: Deck callback id to merge & download.
        sources:
          type: object
          description: Source-attribution configuration for the merged
            output.
          properties:
            add_sources_to_slides_note:
              type: boolean
              description: Render source attributions in slide notes.
          additionalProperties: true
        speaker_notes:
          type: object
          description: Speaker-notes configuration for the merged
            output.
          properties:
            add_speaker_notes_to_slides_note:
              type: boolean
              description: Merge speaker notes into slide notes.
            speaker_notes_type:
              type: string
              description: Speaker-notes formatting style.
          additionalProperties: true
        outputPath:
          type: string
          description: Optional S3 key (path) for the merged output.
        sections:
          type: array
          description: Optional list of sections to include (defaults to
            all).
          items: { type: string }
        outputFormat:
          type: string
          description: Output format (for example `pptx`, `pdf`).
        outputBucket:
          type: string
          description: Optional S3 bucket for the merged output.
      additionalProperties: true

    AutoGeneratorRegenerateRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/regenerate`.
      required: [callback_id]
      properties:
        callback_id:
          type: string
          description: Existing deck callback id.
        audience:
          type: string
          description: Override audience for the regenerated portion.
        template_code:
          type: string
          description: Override template code for the regenerated
            portion.
        slide_override:
          type: object
          description: Slide-level overrides.
          additionalProperties: true
        story_content_override:
          type: object
          description: Narrative-content overrides.
          additionalProperties: true
        context:
          type: object
          description: Additional context to inject into the regenerate
            pass.
          additionalProperties: true
        duration:
          type: string
          description: Desired duration for the regenerated section.
        voice_settings:
          type: object
          description: Voice/tone settings.
          additionalProperties: true
        data_sources_settings:
          type: object
          description: Data-source configuration.
          additionalProperties: true
        preserve_text:
          type: boolean
          description: Preserve existing text where possible.
      additionalProperties: true

    AutoGeneratorNodeChangeRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/node-change`.
      required: [callback_id, slide_callback_id]
      properties:
        callback_id:
          type: string
          description: Deck callback id.
        slide_callback_id:
          type: string
          description: Slide callback id to modify.
        slide_override:
          type: object
          description: Node-level changes to apply to the slide.
          additionalProperties: true
      additionalProperties: true

    AutoGeneratorSlideDataRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/slide-data`.
      required: [slide_callback_id]
      properties:
        slide_callback_id:
          type: string
          description: Slide callback id whose data to return.
      additionalProperties: true

    AutoGeneratorExtractImagesRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/extract-images`.
      required: [s3_bucket, s3_path]
      properties:
        s3_bucket:
          type: string
          description: S3 bucket containing the PowerPoint.
        s3_path:
          type: string
          description: S3 key (path) of the PowerPoint.
        force_update:
          type: boolean
          description: Re-extract even if cached results exist.
      additionalProperties: true

    AutoGeneratorBrandImageSearchRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/brand-image-search`.
      required: [callback_id]
      properties:
        callback_id:
          type: string
          description: Deck callback id (used for scoping to the right
            company).
        query:
          type: string
          description: Search query. Defaults to `*` (return all).
        skip:
          type: integer
          minimum: 0
          description: Number of results to skip (pagination offset).
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of results to return.
      additionalProperties: true

    AutoGeneratorLibraryImageSearchRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/library-image-search`.
      properties:
        searchKey:
          type: string
          description: Search query. If blank, derived from the supplied
            slide context.
        limit:
          type: integer
          default: 30
          description: Maximum number of results.
        offset:
          type: integer
          default: 0
          description: Result offset.
        slide_callback_id:
          type: string
          description: Optional slide callback id used to infer
            `searchKey`.
      additionalProperties: true

    AutoGeneratorReplaceImageRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/replace-image`.
      required: [oldImage, newImage, slide_callback_id]
      properties:
        oldImage:
          type: object
          description: Description of the existing image being replaced.
          required: [meta, shapeType]
          properties:
            meta:
              type: object
              description: Image metadata (size, position, etc.).
              additionalProperties: true
            shapeType:
              type: string
              description: PowerPoint shape type.
          additionalProperties: true
        newImage:
          type: object
          description: Description of the replacement image.
          required: [source]
          properties:
            imageIndex:
              type: integer
              description: Index within the source result set.
            source:
              type: string
              enum: [myWorkspace, adobe, freepik, upload, extracted, s3, brand-images]
              description: Source of the replacement image.
            s3_path:
              type: string
              description: S3 key when `source` is `s3` or `upload`.
            s3_bucket:
              type: string
              description: S3 bucket when `source` is `s3` or `upload`.
            id:
              type: string
              description: Image id when `source` is `adobe`, `freepik`,
                `myWorkspace`, `brand-images`, or `extracted`.
            image:
              type: string
              description: Base64-encoded image content for inline
                uploads.
            extension:
              type: string
              description: File extension (e.g. `png`, `jpg`).
          additionalProperties: true
        slide_callback_id:
          type: string
          description: Slide callback id where the image lives.
        duplicate_slide_callback_id:
          type: string
          description: Optional duplicate slide id to mirror the
            replacement onto.
      additionalProperties: true

    AutoGeneratorReactionFeedbackRequest:
      type: object
      description: Request body for
        `POST /api/v1/autogenerator/reaction-feedback`.
      required: [uuid, type, value]
      properties:
        uuid:
          type: string
          description: Target asset uuid (deck or slide).
        type:
          type: string
          enum: [liked, feedback]
          description: Reaction kind.
        value:
          description: When `type=liked`, a boolean. When
            `type=feedback`, a string.
          oneOf:
            - type: boolean
            - type: string
        shareDetails:
          type: object
          description: Additional details. **Required** when
            `type=feedback`.
          additionalProperties: true
      additionalProperties: true

    AutoGeneratorSlideActionsRequest:
      type: object
      description: |
        Request body for `POST /api/v1/autogenerator/slide-actions`.
        Required fields depend on `action`:
          - `duplicate` / `delete` → `deck_callback_id`,
            `slide_callback_id`.
          - `add_sources_to_slides_note` / `speaker_notes` → `uuid`,
            `type`, `data`.
      required: [action]
      properties:
        action:
          type: string
          enum: [duplicate, delete, add_sources_to_slides_note, speaker_notes]
          description: Sub-action to perform.
        deck_callback_id:
          type: string
          description: Deck callback id (required for `duplicate` /
            `delete`).
        slide_callback_id:
          type: string
          description: Slide callback id (required for `duplicate` /
            `delete`).
        uuid:
          type: string
          description: Target uuid (required for note-style actions).
        type:
          type: string
          description: Note-style sub-type (required for note-style
            actions).
        data:
          type: object
          description: Action-specific payload (required for note-style
            actions).
          additionalProperties: true
      additionalProperties: true

    # ---- AutoGenerator: responses ----------------------------------------
    AutoGeneratorStartResponse:
      description: Response body for `POST /api/v1/autogenerator`.
      allOf:
        - $ref: '#/components/schemas/CallbackEnvelope'

    AutoGeneratorStatusResponse:
      description: Response body for `GET /api/v1/autogenerator/status`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutoGeneratorStatusData'

    AutoGeneratorStatusData:
      type: object
      description: |
        AutoGenerator job state. The handler emits many legacy top-level
        fields alongside the documented ones; only the documented fields
        are part of the contract.
      properties:
        status:
          type: string
          enum: [in_progress, success, failed]
          description: Job status.
        callback_id:
          type: string
          description: The callback id being polled.
        prompt:
          type: string
          description: Original prompt that initiated the job.
        fileName:
          type: string
          description: Filename of the generated deck.
        allSlides:
          type: array
          description: Generated slides (present once `status=success`).
          items:
            type: object
            additionalProperties: true
        extracted_images:
          type: array
          description: Images extracted from supporting files.
          items:
            type: object
            additionalProperties: true
        company:
          type: string
          description: Owning company id.
        companyDisplayName:
          type: string
          description: Owning company display name.
        final_output:
          type: object
          description: Final-output blob (present once
            `status=success`).
          additionalProperties: true
        template_code:
          type: string
          description: Target template code used for generation.
        audience:
          type: string
          description: Target audience used for generation.
        execution_start:
          type: string
          format: date-time
          description: Pipeline start time.
        execution_end:
          type: string
          format: date-time
          description: Pipeline end time (present once terminal).
        presentation_theme:
          type: object
          description: Resolved theme metadata.
          additionalProperties: true
        voice_settings:
          type: object
          description: Voice/tone settings applied.
          additionalProperties: true
        speaker_notes:
          type: object
          description: Speaker-notes configuration applied.
          additionalProperties: true
        cached:
          type: boolean
          description: Whether this response was served from cache.
        cached_at:
          type: string
          format: date-time
          description: Timestamp of the cached entry.
      additionalProperties: true

    AutoGeneratorStatusBulkResponse:
      description: Response body for
        `POST /api/v1/autogenerator/status-bulk`. Standalone schema — unlike
        most responses, `data` is an array, so this does not extend
        SuccessEnvelope (whose `data` is an object).
      type: object
      required: [success, data]
      additionalProperties: true
      properties:
        success:
          type: boolean
          const: true
          description: Always `true` on success.
        data:
          type: array
          description: One entry per requested callback id.
          items:
            type: object
            additionalProperties: true
            properties:
              slide_id:
                type: string
                description: Slide id within the deck.
              layouts:
                type: array
                description: Layouts available for this slide.
                items:
                  type: object
                  additionalProperties: true

    AutoGeneratorMetaResponse:
      description: Response body for `POST /api/v1/autogenerator/meta`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              description: Metadata payload from the SlideMeta service
                (passthrough).
              additionalProperties: true

    AutoGeneratorDownloadResponse:
      description: Response body for
        `POST /api/v1/autogenerator/download`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [download_url]
              properties:
                status:
                  type: string
                  enum: [success]
                  description: Merge status.
                output_file:
                  type: string
                  description: S3 key of the merged file.
                download_url:
                  type: string
                  format: uri
                  description: Signed download URL.
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    AutoGeneratorRegenerateResponse:
      description: Response body for
        `POST /api/v1/autogenerator/regenerate`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [new_callback_id]
              properties:
                new_callback_id:
                  type: string
                  description: Callback id to poll for the regenerate
                    sub-job.
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    AutoGeneratorGenericDataResponse:
      description: Generic success envelope where `data` is an opaque
        object passed through from a downstream service. Used by
        node-change, slide-data, extract-images.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              description: Downstream payload (shape varies).
              additionalProperties: true

    AutoGeneratorMessageDataResponse:
      description: Success envelope with a human-readable `message`
        alongside `data`. Used by image-search and replace-image.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              description: Service-specific payload.
              additionalProperties: true

    AutoGeneratorReactionFeedbackResponse:
      description: Response body for
        `POST /api/v1/autogenerator/reaction-feedback`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                uuid:
                  type: string
                  description: Target asset uuid.
                type:
                  type: string
                  enum: [liked, feedback]
                  description: Reaction kind.
                value:
                  description: Recorded value.
                  oneOf:
                    - type: boolean
                    - type: string
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    AutoGeneratorSlideActionsResponse:
      description: |
        Response body for `POST /api/v1/autogenerator/slide-actions`.
        The `data` shape depends on the requested `action`:
          - `duplicate` → `{ new_callback_id }`.
          - `delete` → `{ deleted_slide_id }`.
          - `add_sources_to_slides_note` / `speaker_notes` → service
            payload.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                new_callback_id:
                  type: string
                  description: Returned for `action=duplicate`.
                deleted_slide_id:
                  type: string
                  description: Returned for `action=delete`.
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    # ---- Audiences -------------------------------------------------------
    AudiencesSearchRequest:
      type: object
      description: Request body for `POST /api/v1/audiences/search`.
      properties:
        query:
          type: string
          description: Free-text search query.
        id:
          type: string
          description: Filter to a single audience by id.
        sort:
          type: string
          description: Sort expression (for example `name:asc`).
        filterBy:
          type: object
          description: Field-level filter.
          additionalProperties: true
        filterByCollection:
          type: object
          description: Collection-level filter.
          additionalProperties: true
        fields:
          type: array
          description: Subset of fields to return.
          items: { type: string }
        extraFields:
          type: array
          description: Additional fields to include beyond defaults.
          items: { type: string }
        limit:
          type: integer
          default: 15
          description: Maximum number of results.
      additionalProperties: true

    AudiencesListResponse:
      description: Response body for `GET /api/v1/audiences` and
        `POST /api/v1/audiences/search`. `result` and `items` are the same
        array of audience profiles (`items` is the pagination alias).
      type: object
      additionalProperties: true
      required: [result]
      properties:
        success:
          type: boolean
          description: Always `true` on success.
        result:
          type: array
          description: Audience profiles.
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
                description: Audience identifier.
              name:
                type: string
                description: Audience name.
        items:
          type: array
          description: Same audience profiles as `result` (present when paginating).
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: ['string', 'null']
          description: Opaque cursor for the next page, or `null` on the last
            page. Pagination is opt-in — omit `limit`/`cursor` to receive the
            full list.

    # ---- Themes ----------------------------------------------------------
    ThemesListResponse:
      description: Response body for `GET /api/v1/themes` and the
        templates endpoints under autogenerator/template-converter. `data`
        is the array of themes/templates; `next_cursor` is a sibling field.
      type: object
      additionalProperties: true
      required: [data]
      properties:
        success:
          type: boolean
          description: Always `true` on success.
        data:
          type: array
          description: Themes / templates.
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
                description: Theme identifier.
              name:
                type: string
                description: Theme display name.
              code:
                type: string
                description: Internal theme code.
              source:
                type: string
                description: Origin (e.g. brand, prezent).
        next_cursor:
          type: ['string', 'null']
          description: Opaque cursor for the next page, or `null` on the last
            page. Pagination is opt-in — omit `limit`/`cursor` to receive the
            full list.

    # ---- File Access -----------------------------------------------------
    FileAccessRequest:
      type: object
      description: Request body for `POST /api/v1/file-access`.
      required: [filePaths]
      properties:
        filePaths:
          type: array
          description: List of stored file paths to mint tokens for.
          minItems: 1
          items: { type: string }
        source:
          type: string
          enum: [betaimages, magikarp]
          description: Storage backend source.
      additionalProperties: true

    FileAccessResponse:
      description: Response body for `POST /api/v1/file-access`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [access_tokens]
              properties:
                access_tokens:
                  type: object
                  description: Map of `filePath` → signed access token.
                  additionalProperties:
                    type: string
                    description: Signed access token for the
                      corresponding file path.
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    # ---- Upload / Preprocess / Validate ----------------------------------
    UploadFileRequest:
      type: object
      description: Request body for `POST /api/v1/upload`.
      required: [fileContent, fileName]
      properties:
        fileContent:
          type: string
          description: File content as a base64 string or `data:` URL.
        fileName:
          type: string
          description: Original filename including extension.
      additionalProperties: true

    UploadFileResponse:
      description: Response body for `POST /api/v1/upload`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [file]
              properties:
                file:
                  type: object
                  required: [file_id, file_name, file_type, s3_path, s3_bucket]
                  properties:
                    file_id:
                      type: string
                      description: Internal id of the uploaded file.
                    file_name:
                      type: string
                      description: Original filename.
                    file_type:
                      type: string
                      description: MIME type / detected file type.
                    s3_path:
                      type: string
                      description: S3 key of the uploaded file.
                    s3_bucket:
                      type: string
                      description: S3 bucket of the uploaded file.
                  additionalProperties: true
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    PreprocessFileRequest:
      type: object
      description: Request body for `POST /api/v1/preprocess` and
        `POST /api/v1/template-converter/preprocess`.
      required: [fileContent, fileName, chunkIndex, totalChunks, requestIdentifier]
      properties:
        fileContent:
          type: string
          description: Chunk content as base64 / `data:` URL.
        fileName:
          type: string
          description: Original filename including extension.
        chunkIndex:
          type: integer
          minimum: 0
          description: Zero-based index of this chunk.
        totalChunks:
          type: integer
          minimum: 1
          description: Total number of chunks for this upload.
        requestIdentifier:
          type: string
          description: Caller-supplied identifier that groups chunks of
            the same upload.
      additionalProperties: true

    PreprocessFileResponse:
      description: Response body for `POST /api/v1/preprocess` and
        `POST /api/v1/template-converter/preprocess`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [request_identifier, file_name]
              properties:
                request_identifier:
                  type: string
                  description: The caller-supplied identifier.
                file_name:
                  type: string
                  description: The filename that was processed.
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    ValidateFilesRequest:
      type: object
      description: |
        Request body for `POST /api/v1/validate`. At least one of
        `fileIdentifiers` or `webLinks` must be non-empty.
      properties:
        fileIdentifiers:
          type: object
          description: Map of `uuid` → `fileName` for previously uploaded
            files.
          additionalProperties:
            type: string
            description: Original filename for that uuid.
        webLinks:
          type: array
          description: List of URLs to validate.
          items: { type: string, format: uri }
      additionalProperties: true

    ValidateFilesResponse:
      description: Response body for `POST /api/v1/validate`.
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                files:
                  type: array
                  description: Per-file validation results.
                  items:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: File uuid.
                      file_name:
                        type: string
                        description: Original filename.
                      valid:
                        type: boolean
                        description: Whether the file passed validation.
                      reason:
                        type: string
                        description: Failure reason when `valid=false`.
                    additionalProperties: true
                web_links:
                  type: array
                  description: Per-link validation results.
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                        description: The link.
                      valid:
                        type: boolean
                        description: Whether the link is reachable and
                          ingestable.
                      reason:
                        type: string
                        description: Failure reason when `valid=false`.
                    additionalProperties: true
                message:
                  type: string
                  description: Human-readable confirmation.
              additionalProperties: true

    # ---- Template Converter: requests ------------------------------------
    TemplateConverterStartRequest:
      type: object
      description: Request body for
        `POST /api/v1/template-converter/start`.
      required: [templateName]
      properties:
        fileId:
          type: string
          description: Identifier of a previously uploaded input deck.
            Mutually exclusive with `inputDeck`.
        inputDeck:
          type: object
          description: Inline reference to the input deck (S3 path /
            chunk identifier). Mutually exclusive with `fileId`.
          additionalProperties: true
        templateName:
          type: string
          description: Name of the target brand template.
        includeImageWithoutData:
          type: boolean
          description: Carry over images that have no associated data.
        includeImageWithData:
          type: boolean
          description: Carry over images that have associated data.
        includeIcons:
          type: boolean
          description: Carry over icons.
        includeSpecialColor:
          type: boolean
          description: Preserve special color treatments from the source
            deck.
        settings:
          type: object
          description: Per-conversion settings.
          properties:
            ai_mode:
              type: string
              description: Conversion AI mode.
            work_area_option:
              type: string
              description: Default work-area option.
            modifyFormat:
              type: object
              description: Default formatting overrides.
              additionalProperties: true
            color_preference:
              type: string
              description: Color treatment preference.
            content_formatting:
              type: string
              description: Content-formatting preference.
          additionalProperties: true
        modifyFormat:
          type: object
          description: Optional top-level format overrides (legacy
            placement).
          additionalProperties: true
      additionalProperties: true

    TemplateConverterFinalprocessRequest:
