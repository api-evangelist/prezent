openapi: 3.1.0

info:
  title: Prezent Platform API
  version: 1.0.0
  summary: Agent-ready REST API for Prezent's content-generation and template-conversion services.
  description: |
    The Prezent Platform API exposes Prezent's AutoGenerator, Template Converter,
    Audiences, Themes, and File-upload services as a uniform JSON HTTP API.

    This contract describes the **target agent-ready shape** of the API: every
    documented endpoint returns a uniform success envelope `{ "success": true,
    "data": { ... } }` or a uniform error envelope `{ "success": false,
    "data": null, "error": { "code": "...", "message": "...", "details": { ... } } }`.
    Error codes are drawn from a stable catalog (see `ErrorCode`). The contract
    is additive: handlers may continue to emit legacy keys alongside the
    documented ones for backwards compatibility, so schemas explicitly allow
    additional properties at the envelope and data levels.

    Several endpoints kick off long-running background work and return a
    `callback_id` that the client polls against a corresponding status
    endpoint. The canonical async polling endpoint for the Template Converter
    family is **`GET /api/v2/template-converter/status/{callback_id}`** which
    uses strict HTTP-status mapping (200 only on workflow success, 4xx/5xx on
    workflow failure). The v1 polling endpoint at
    `/api/v1/template-converter/status/{callbackId}` (and its REST alias
    `GET /api/v1/template-conversions/{callback_id}`) continues to be served
    with legacy semantics (HTTP 200 with `status` field) and is intentionally
    omitted from this documentation.

    **REST resource aliases (v1.1).** AutoGenerator and Template Converter
    endpoints are documented here under their REST-resource path names
    (`/api/v1/autogenerations`, `/api/v1/template-conversions`). The legacy
    RPC-style paths under `/api/v1/autogenerator/*` and
    `/api/v1/template-converter/*` continue to be served indefinitely; they
    return a `Deprecation: true` header pointing to the successor alias.

    **Conventions that apply to every endpoint** (full reference in the
    companion guides on this documentation site):

    - **Auth:** API key as a Bearer token — `Authorization: Bearer <key>`.
      Each key is scoped to an allow-list of endpoint paths; an out-of-scope
      call returns `404 ENDPOINT_NOT_FOUND`.
    - **Rate limits:** gateway throttle 10 req/s sustained, 5 burst,
      1,000 req/day per key; per-company per-category 60-second sliding
      windows; annual quotas (50,000 slide generations/yr, 1,000,000
      downloads/yr). Limit breaches return `429` with `error.code`
      `TOO_MANY_REQUESTS` (gateway), `RATE_LIMIT_EXCEEDED` (per-category),
      or `USAGE_LIMIT_EXCEEDED` (annual).
    - **Errors:** every error uses the `{ success:false, data:null, error:{
      code, message, details } }` envelope with stable, documented `code`
      values.
    - **Idempotency & pagination:** mutating requests accept an
      `Idempotency-Key`; list endpoints accept opt-in `limit`/`cursor`
      paging.

    **Building with an AI agent?** Prezent ships a first-class Model Context
    Protocol (MCP) server. The hosted endpoint is
    `https://mcp.myprezent.com/mcp` (OAuth 2.1, works with Claude.ai Custom
    Connectors); a local stdio server is published on PyPI as
    `prezent-mcp-server` and plugs into Claude Desktop, Cursor, Cline,
    Continue, and Zed. The MCP tools wrap the same REST endpoints
    described here.

    **Official SDKs.** Typed REST clients are published for Python and
    TypeScript (`prezent-sdk`) — generated from and versioned against this
    spec. For other languages, generate a client from this document.

    **Out of scope of this document:** SCIM endpoints under `/api/v1/scim/*`.
    Those endpoints conform to RFC 7644 (SCIM 2.0) and follow a different
    envelope (`schemas`, `Resources`, `totalResults`, etc.). They are
    documented separately at /docs/scim-user-management.
  x-out-of-scope-note: |
    SCIM endpoints (`/api/v1/scim/*`) are NOT included in this spec. They
    follow RFC 7644 (SCIM 2.0) and are documented in a separate document at
    /docs/scim-user-management.
  contact:
    name: Prezent API Support
    email: support@prezent.ai
    url: https://prezent.ai
  license:
    name: Proprietary - Prezent, Inc.
    url: https://prezent.ai/terms

servers:
  - url: https://api.prezent.ai
    description: Production (canonical)
  - url: https://uatstage-api.myprezent.com
    description: UAT (user acceptance testing)
  - url: https://devstage-api.myprezent.com
    description: Development

security:
  - BearerAuth: []

tags:
  - name: AutoGenerator
    description: Long-running and synchronous endpoints that generate and
      manipulate AI-authored presentations from prompts, files, and assets.
  - name: Template Converter
    description: Apply a target brand template to an uploaded presentation,
      including review suggestions, work-area adjustment, layout change,
      and download.
  - name: Audiences
    description: List and search the audience profiles configured for the
      caller's company.
  - name: Themes
    description: List the presentation themes (brand templates) configured
      for the caller's company.
  - name: Upload
    description: Validate, preprocess, and upload supporting files
      (PowerPoint, PDF, images, etc.).
  - name: File Access
    description: Mint short-lived access tokens for the caller's stored
      files.
  - name: Webhooks
    description: Receive signed HTTPS callbacks when Prezent jobs complete
      or fail. Subscriptions are scoped per API key, retried over a 21h
      window, and auto-disabled after 50 consecutive failures. See the
      [Webhooks guide](/docs/webhooks) for the signature format and
      verification examples.
  - name: Streaming
    description: Open a Server-Sent Events stream to receive real-time
      progress events as Prezent generates a presentation. See the
      [Streaming guide](/docs/streaming) for a full walk-through plus
      reconnect semantics.
  - name: Health
    description: Liveness and component health-check endpoints.

paths:

  # -------------------------------------------------------------------------
  # Health
  # -------------------------------------------------------------------------
  /test:
    get:
      tags: [Health]
      summary: Liveness check
      description: |
        Returns a fixed greeting payload. Exists to allow clients to verify
        connectivity and credentials. Does not consult any downstream
        services.
      operationId: getTest
      x-rate-limit-category: general
      responses:
        '200':
          description: API is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /health:
    get:
      tags: [Health]
      summary: Component health check
      description: |
        Reports the status of downstream services. With no `category`
        parameter, returns a simple "alive" greeting. With
        `category=autogenerator` or `category=scim`, reports
        per-component status and returns 503 if any required service is
        unhealthy.
      operationId: getHealth
      x-rate-limit-category: general
      parameters:
        - in: query
          name: category
          description: Component group to check. Omit for a generic
            liveness response.
          required: false
          schema:
            type: string
            enum: [autogenerator, scim]
      responses:
        '200':
          description: All checked components healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  # -------------------------------------------------------------------------
  # AutoGenerator family
  # -------------------------------------------------------------------------
  /api/v1/autogenerations:
    post:
      tags: [AutoGenerator]
      summary: Create an AutoGenerator job
      description: |
        Kicks off a background pipeline that turns the supplied prompt,
        context files, and assets into a Prezent presentation. Returns a
        `callback_id` that the caller polls via
        `GET /api/v1/autogenerations/{callback_id}` until `status` is
        `success` or `failed`.
      operationId: createAutogeneration
      x-rate-limit-category: autogenerator
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorStartRequest'
      responses:
        '200':
          description: Job accepted; client must poll for completion.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorStartResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/{callback_id}:
    get:
      tags: [AutoGenerator]
      summary: Read an AutoGenerator job
      description: |
        Returns the current state of a previously started AutoGenerator job.
        The `status` field in the response data is one of
        `in_progress`, `success`, or `failed`. Once `success`, the payload
        also contains the generated slides, extracted images, theme/audience
        metadata, and other context required to display or further edit
        the deck.

        For the same `callback_id`, polling after `status=success` returns
        the same cached payload.
      operationId: getAutogeneration
      x-rate-limit-category: autogenerator
      parameters:
        - $ref: '#/components/parameters/CallbackIdPath'
        - in: query
          name: deck_callback_id
          required: false
          description: Original deck callback id when polling a regenerate
            sub-job.
          schema: { type: string }
        - in: query
          name: operation
          required: false
          description: Sub-operation hint (used by regenerate flows).
          schema: { type: string }
        - in: query
          name: status_auto_polling
          required: false
          description: Pass `true` to indicate the caller is auto-polling;
            affects how stalled jobs are surfaced.
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Current job status returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorStatusResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/lookups:
    post:
      tags: [AutoGenerator]
      summary: Look up multiple AutoGenerator jobs in one call
      description: |
        Returns layout metadata for each `callback_id` in the request. Use
        when rendering a list view that needs many decks at once.
      operationId: createAutogenerationLookup
      x-rate-limit-category: autogenerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorStatusBulkRequest'
      responses:
        '200':
          description: Bulk status returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorStatusBulkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerator/meta:
    post:
      tags: [AutoGenerator]
      summary: Fetch slide-metadata for asset IDs
      description: |
        Returns slide-level metadata (titles, layout codes, thumbnails) for
        each asset id provided. Used by editors that need to enrich a slide
        list without re-running generation.
      operationId: getAutoGeneratorMeta
      x-rate-limit-category: autogenerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorMetaRequest'
      responses:
        '200':
          description: Metadata returned for each asset id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorMetaResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/{callback_id}/downloads:
    post:
      tags: [AutoGenerator]
      summary: Create a download artefact for an AutoGenerator deck
      description: |
        Synchronously merges all slides for the given `callback_id` into a
        single PowerPoint (or PDF, depending on `outputFormat`) and returns
        a signed download URL. The merge step can take up to 60 seconds.
        Subject to the `AUTO_GEN_DOWNLOAD` usage limit in addition to the
        normal rate limits.
      operationId: createAutogenerationDownload
      x-rate-limit-category: autogenerator
      parameters:
        - $ref: '#/components/parameters/CallbackIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorDownloadRequest'
      responses:
        '200':
          description: Merged deck produced; signed URL returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorDownloadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/{callback_id}/regenerations:
    post:
      tags: [AutoGenerator]
      summary: Create a regeneration of an AutoGenerator deck
      description: |
        Re-runs a portion of an existing AutoGenerator deck — typically a
        slide, node, or section — and returns a new `callback_id` to poll.
        Counted as a fresh generation against the `AUTO_GEN` usage cap.
      operationId: createAutogenerationRegeneration
      x-rate-limit-category: autogenerator
      parameters:
        - $ref: '#/components/parameters/CallbackIdPath'
        - in: query
          name: operation
          required: true
          description: The regenerate sub-operation (for example
            `node_change`, `slide_regenerate`).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorRegenerateRequest'
      responses:
        '200':
          description: Regenerate job accepted; poll the returned
            `new_callback_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorRegenerateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/{callback_id}/node-changes:
    post:
      tags: [AutoGenerator]
      summary: Create a node-level change on an AutoGenerator slide
      description: |
        Mutates a single node (text, image, shape) within a slide of an
        existing deck. Returns the updated slide payload synchronously.
      operationId: createAutogenerationNodeChange
      x-rate-limit-category: autogenerator
      parameters:
        - $ref: '#/components/parameters/CallbackIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorNodeChangeRequest'
      responses:
        '200':
          description: Node change applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorGenericDataResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerator/slide-data:
    post:
      tags: [AutoGenerator]
      summary: Fetch slide data for a single slide callback
      description: |
        Returns the raw slide-data document (text, images, layout,
        speaker notes) for the given `slide_callback_id`.
      operationId: getAutoGeneratorSlideData
      x-rate-limit-category: autogenerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorSlideDataRequest'
      responses:
        '200':
          description: Slide data returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorGenericDataResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/{callback_id}/image-extractions:
    post:
      tags: [AutoGenerator]
      summary: Create an image-extraction for an AutoGenerator deck
      description: |
        Reads the PowerPoint at the given S3 location and returns the list
        of embedded images. If `force_update` is true, re-runs extraction
        even when cached results exist.
      operationId: createAutogenerationImageExtraction
      x-rate-limit-category: autogenerator
      parameters:
        - $ref: '#/components/parameters/CallbackIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorExtractImagesRequest'
      responses:
        '200':
          description: Image list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorGenericDataResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerator/brand-image-search:
    post:
      tags: [AutoGenerator]
      summary: Search the caller's brand-image library
      description: |
        Returns brand images that match the query string, ordered by
        relevance. Supports `skip` and `limit` for pagination.
      operationId: searchAutoGeneratorBrandImages
      x-rate-limit-category: autogenerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorBrandImageSearchRequest'
      responses:
        '200':
          description: Matching brand images returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorMessageDataResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerator/library-image-search:
    post:
      tags: [AutoGenerator]
      summary: Search the configured stock-image library
      description: |
        Searches the configured stock image provider (Adobe Stock or
        Freepik, depending on company configuration). Supports
        `limit`/`offset` pagination. If `searchKey` is omitted, the
        handler infers it from the supplied slide context.
      operationId: searchAutoGeneratorLibraryImages
      x-rate-limit-category: autogenerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorLibraryImageSearchRequest'
      responses:
        '200':
          description: Matching library images returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorMessageDataResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/{callback_id}/image-replacements:
    post:
      tags: [AutoGenerator]
      summary: Create an image replacement on an AutoGenerator slide
      description: |
        Swaps an image on a slide with a new image sourced from the
        caller's workspace, Adobe Stock, Freepik, a previously uploaded
        file, an extracted image, or S3.
      operationId: createAutogenerationImageReplacement
      x-rate-limit-category: autogenerator
      parameters:
        - $ref: '#/components/parameters/CallbackIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoGeneratorReplaceImageRequest'
      responses:
        '200':
          description: Image replacement completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoGeneratorMessageDataResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }

  /api/v1/autogenerations/{callback_id}/reactions:
    post:
      tags: [AutoGenerator]
      summary: Create a reaction on an AutoGenerator deck
      description: |
        Persists a user reaction (like) or qualitative feedback against a
