              additionalProperties: true

    # ---- Webhooks --------------------------------------------------------
    #
    # Subscription-management plane. The HMAC secret is returned ONCE
    # (on create + rotate) — reads only expose `secret_prefix`.
    #
    # The `WebhookEvent` schema below documents the SHAPE OF THE PAYLOAD
    # we POST to subscribers' URLs. It is not the body of any
    # request/response on these endpoints; it lives here so subscribers
    # can codegen a parser.

    WebhookEventType:
      type: string
      description: |
        Catalog of event types emitted by Prezent. New types may be
        added without notice; clients should ignore unknown values.
      enum:
        - autogeneration.completed
        - autogeneration.failed
        - template_conversion.completed
        - template_conversion.failed
        - webhook.test

    WebhookSubscriptionStatus:
      type: string
      enum: [active, disabled]
      description: |
        `active` subscriptions receive deliveries. `disabled`
        subscriptions are skipped at dispatch time — either explicitly
        set by the customer or set by Prezent's auto-disable rule after
        50 consecutive delivery failures. PATCH `status: active` to
        re-enable.

    WebhookSubscription:
      type: object
      description: |
        Core read-shape for a webhook subscription. Returned by GET +
        PATCH endpoints. Never includes the raw HMAC secret — only
        `secret_prefix` (the first 6 chars, for human disambiguation).
      required: [id, url, secret_prefix, events, status, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^whsub_[a-f0-9]{32}$'
          example: whsub_3f7a9b1c8d2e4f5a6b7c8d9e0f1a2b3c
        url:
          type: string
          format: uri
          description: HTTPS endpoint receiving signed deliveries.
          example: https://hooks.example.com/prezent
        secret_prefix:
          type: string
          description: First 6 characters of the HMAC secret, for human
            disambiguation. Always `whsec_` for current implementations.
          example: whsec_
        events:
          type: array
          description: |
            Event types this subscription receives. Use `["*"]` to
            subscribe to everything, including future event types.
          items: { $ref: '#/components/schemas/WebhookEventType' }
          minItems: 1
          example: [autogeneration.completed, autogeneration.failed]
        description:
          type: string
          nullable: true
          description: Free-form human label for the subscription.
          example: Push completions into our deal-room worker.
        status:
          $ref: '#/components/schemas/WebhookSubscriptionStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_delivery_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent successful delivery.
        last_failure_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent failed delivery.
        consecutive_failure_count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Failures since the last successful delivery. At 50 the
            subscription is auto-disabled.
      additionalProperties: true

    # ----- Streaming -------------------------------------------------
    StreamSessionCreateRequest:
      type: object
      required: [callback_id]
      properties:
        callback_id:
          type: string
          description: |
            The `callback_id` returned by your earlier call to
            `POST /api/v1/autogenerations` (or other async endpoint).
            The calling API key must own this job.
          example: cb_01HZQ3Y7K3D6V0A0CS7HD3

    StreamSessionCreateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [session_id, stream_url, expires_at]
          properties:
            session_id:
              type: string
              description: Same as the `callback_id` you passed in.
              example: cb_01HZQ3Y7K3D6V0A0CS7HD3
            stream_url:
              type: string
              format: uri
              description: |
                Open with `new EventSource(stream_url)` (or `fetch`
                + ReadableStream). Hostname is environment-dependent
                (e.g. `stream-api.myprezent.com`). The embedded token
                expires at `expires_at`.
              example: https://stream-api.myprezent.com/v1/streams/cb_01HZQ3Y7K3D6V0A0CS7HD3?token=eyJhbGciOi...
            expires_at:
              type: string
              format: date-time
              description: When the embedded token stops being accepted.
                Call this endpoint again to refresh.
              example: '2026-06-09T10:05:00Z'

    # ----- Webhooks --------------------------------------------------
    WebhookSubscriptionCreateRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: |
            HTTPS endpoint to receive deliveries. Must use `https://`,
            resolve to a public IP, and not use a disallowed port. See
            the [Webhooks guide](/docs/webhooks#url-requirements).
          example: https://hooks.example.com/prezent
        events:
          type: array
          description: Event types to subscribe to. Defaults to `["*"]`.
          items: { $ref: '#/components/schemas/WebhookEventType' }
          default: ["*"]
          example: [autogeneration.completed, autogeneration.failed]
        description:
          type: string
          nullable: true
          example: Push completions into our deal-room worker.
        status:
          $ref: '#/components/schemas/WebhookSubscriptionStatus'
      additionalProperties: false

    WebhookSubscriptionUpdateRequest:
      type: object
      description: Partial update. Any combination of fields may be supplied.
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          minItems: 1
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/WebhookSubscriptionStatus'
      additionalProperties: false

    WebhookSubscriptionCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/WebhookSubscription'
                - type: object
                  required: [secret]
                  properties:
                    secret:
                      type: string
                      description: |
                        The raw HMAC secret. Returned ONCE on this
                        endpoint and on `/rotate-secret`. Store it
                        immediately — subsequent reads expose only
                        `secret_prefix`.
                      example: whsec_4mZkV8t9oFp1qR3sT7uW9xY2zA5bCdEfGhI

    WebhookSubscriptionReadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WebhookSubscription'

    WebhookSubscriptionListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/WebhookSubscription' }
                next_cursor:
                  type: string
                  nullable: true
                  description: Pass to the next call's `cursor` query
                    param. `null` when no more pages.

    WebhookSubscriptionDeleteResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id, deleted]
              properties:
                id:
                  type: string
                  example: whsub_3f7a9b1c8d2e4f5a6b7c8d9e0f1a2b3c
                deleted:
                  type: boolean
                  const: true

    WebhookSubscriptionRotateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id, secret, secret_prefix, rotated_at]
              properties:
                id:
                  type: string
                  example: whsub_3f7a9b1c8d2e4f5a6b7c8d9e0f1a2b3c
                secret:
                  type: string
                  description: The freshly-issued HMAC secret. Stored
                    nowhere by Prezent after this response — capture it
                    before forwarding.
                  example: whsec_NewlyGeneratedSecretMaterial
                secret_prefix:
                  type: string
                  example: whsec_
                rotated_at:
                  type: string
                  format: date-time

    WebhookSubscriptionTestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [subscription_id, event, delivery]
              properties:
                subscription_id:
                  type: string
                  example: whsub_3f7a9b1c8d2e4f5a6b7c8d9e0f1a2b3c
                event:
                  $ref: '#/components/schemas/WebhookEvent'
                delivery:
                  type: object
                  required: [ok, status, delivery_id]
                  properties:
                    ok:
                      type: boolean
                      description: True if the receiver returned a 2xx.
                    status:
                      type: integer
                      description: HTTP status code from the receiver
                        (0 on network error / timeout).
                      example: 200
                    error:
                      type: string
                      nullable: true
                      description: Network error code (`timeout`,
                        `ECONNREFUSED`, etc.). `null` on success.
                    response_body_preview:
                      type: string
                      description: First 8 KiB of the receiver's response
                        body, for debugging.
                    delivery_id:
                      type: string
                      pattern: '^whdl_[a-f0-9]{24}$'
                      description: Internal delivery id. Also sent to the
                        receiver in the `X-Prezent-Delivery` header.

    WebhookEvent:
      type: object
      description: |
        Payload **POSTed to your subscription URL**. This is NOT the
        body of any management endpoint — it is what your receiver
        parses. Verify the signature first; see the [Webhooks
        guide](/docs/webhooks#4-verify-the-signature).
      required: [id, type, api_version, created_at, data]
      properties:
        id:
          type: string
          pattern: '^evt_[a-zA-Z0-9_]+$'
          description: Globally unique event identifier. Also sent in
            the `X-Prezent-Event` header. Dedupe on this if you receive
            the same event twice (at-least-once delivery).
          example: evt_8c2a1f7e6d3b4a5c9e0f8d7b6a5c4d3e
        type:
          $ref: '#/components/schemas/WebhookEventType'
        api_version:
          type: string
          description: Schema version for the `data` field. Increments
            only on breaking changes; legacy versions remain available.
          example: "1.0"
        created_at:
          type: string
          format: date-time
        data:
          type: object
          description: |
            Event-specific payload. For `autogeneration.*` events,
            contains `callback_id`, `report_id`, `status`, plus
            `outputs` (on success) or `error_log` (on failure). For
            `template_conversion.*` events, contains the conversion
            `callback_id`, `status`, and output URLs.
          additionalProperties: true

  responses:
    BadRequest:
      description: Generic client error. `error.code` is one of
        `BAD_REQUEST`, `INVALID_JSON`, `MISSING_REQUIRED_FIELD`,
        `MISSING_QUERY_PARAM`, `MISSING_CALLBACK_ID`,
        `MISSING_SLIDES_ARRAY`, `MISSING_PROMPT`, `MISSING_TEMPLATE_ID`,
        `MISSING_FILE_CONTENT`, `MISSING_SHARE_DETAILS`, `INVALID_TYPE`,
        `INVALID_DATA`, `INVALID_DATA_TYPE`, `INVALID_PAYLOAD`,
        `INVALID_REQUEST`, `API_REQUEST_FAILED`, or
        `FILE_UPLOAD_FAILED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: BAD_REQUEST
              message: Bad request.
              details: {}

    Unauthorized:
      description: |
        Caller did not present a valid Bearer token, or the token has
        expired. `error.code` is one of `UNAUTHORIZED`, `INVALID_API_KEY`,
        `EXPIRED_API_KEY`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: INVALID_API_KEY
              message: API key not found or not authorized.
              details: {}

    Forbidden:
      description: Caller is authenticated but not allowed to perform
        this operation. `error.code` is `FORBIDDEN`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: FORBIDDEN
              message: Access to the resource is forbidden.
              details: {}

    NotFound:
      description: |
        Requested endpoint or resource does not exist. `error.code` is
        one of `ENDPOINT_NOT_FOUND`, `RESOURCE_NOT_FOUND`, `NOT_FOUND`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: RESOURCE_NOT_FOUND
              message: The requested resource was not found.
              details: {}

    MethodNotAllowed:
      description: HTTP method not allowed for this endpoint.
        `error.code` is `METHOD_NOT_ALLOWED`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: METHOD_NOT_ALLOWED
              message: HTTP method not allowed.
              details: {}

    UnsupportedFileType:
      description: Uploaded file's extension or MIME type is not
        accepted. `error.code` is `UNSUPPORTED_FILE_TYPE`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: UNSUPPORTED_FILE_TYPE
              message: Unsupported file type.
              details: {}

    UnprocessableEntity:
      description: |
        Request was well-formed but failed semantic validation.
        `error.code` is one of `INVALID_INPUT`, `UNPROCESSABLE_ENTITY`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: INVALID_INPUT
              message: Invalid input provided.
              details: {}

    IdempotencyConflict:
      description: |
        The supplied `Idempotency-Key` was already used with a different
        request body. Reuse a key only for identical retried requests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: IDEMPOTENCY_KEY_REUSED_WITH_DIFFERENT_BODY
              message: This Idempotency-Key was already used with a different request body.
              details: {}

    RateLimited:
      description: |
        Rate limit, usage limit, or gateway-level throttle exceeded.
        `error.code` is `TOO_MANY_REQUESTS` (gateway throttle),
        `RATE_LIMIT_EXCEEDED` (per-category), or `USAGE_LIMIT_EXCEEDED`
        (annual quota).

        Default limits (all configurable per company/key):
        - Gateway throttle (per API key) → `TOO_MANY_REQUESTS`: 10 requests/second
          sustained, 5 burst, 1,000 requests/day.
        - Per-company, per-category sliding 60-second window →
          `RATE_LIMIT_EXCEEDED`. The applicable category is given by each
          operation's `x-rate-limit-category`.
        - Annual usage quota → `USAGE_LIMIT_EXCEEDED`: 50,000 slide
          generations/year and 1,000,000 presentation downloads/year.

        `X-RateLimit-Limit`/`X-RateLimit-Remaining`/`X-RateLimit-Reset` are
        returned on successful (2xx) responses from rate-limited endpoints
        and, with `Retry-After`, on the per-category `RATE_LIMIT_EXCEEDED`
        429 (the headers declared below). The gateway `TOO_MANY_REQUESTS`
        and annual `USAGE_LIMIT_EXCEEDED` responses do not carry them. Read
        `X-RateLimit-Remaining` to self-throttle and honour `Retry-After` on
        a 429.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Rate limit exceeded for this category. Try again later.
              details:
                category: auto_generator
                retry_after_seconds: 12

    InternalServerError:
      description: Unexpected server error. `error.code` is
        `INTERNAL_SERVER_ERROR`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected server error occurred.
              details: {}

    ServiceUnavailable:
      description: Service is temporarily unavailable (downstream
        dependency unhealthy). `error.code` is `SERVICE_UNAVAILABLE` or
        `EXTERNAL_SERVICE_ERROR`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: SERVICE_UNAVAILABLE
              message: Service is temporarily unavailable.
              details: {}

    GatewayTimeout:
      description: A downstream call timed out. `error.code` is
        `GATEWAY_TIMEOUT`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            success: false
            data: null
            error:
              code: GATEWAY_TIMEOUT
              message: Gateway timeout.
              details: {}
