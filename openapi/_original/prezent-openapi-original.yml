  # -------------------------------------------------------------------------
  /api/v1/templates:
    get:
      tags: [Themes]
      summary: List templates available to a feature
      description: |
        Returns the themes/templates available to the caller's company,
        optionally filtered to a specific feature. This single endpoint
        replaces the legacy `GET /api/v1/autogenerator/templates` and
        `GET /api/v1/template-converter/templates` aliases — pass the
        `feature` query parameter to scope results.

        **Pagination is opt-in.** Send `limit` (and follow `next_cursor`)
        to page; omit both `limit` and `cursor` to receive the full list
        unchanged.
      operationId: listTemplates
      x-rate-limit-category: general
      parameters:
        - in: query
          name: feature
          required: false
          description: Filter to templates enabled for a specific feature.
          schema:
            type: string
            enum: [auto_generator, template_converter]
        - in: query
          name: name
          required: false
          description: Optional case-insensitive name filter.
          schema: { type: string }
        - in: query
          name: sort
          required: false
          description: Sort expression (for example `name:asc`).
          schema: { type: string }
        - in: query
          name: limit
          required: false
          description: Items per page (1–200, default 50). Enables pagination.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          required: false
          description: Opaque cursor from a previous response's `next_cursor`.
          schema: { type: string }
        - in: query
          name: source
          required: false
          description: Source filter (e.g. brand vs prezent).
          schema: { type: string }
        - in: query
          name: enabledFeature
          required: false
          description: Optional feature flag filter.
          schema: { type: string }
      responses:
        '200':
